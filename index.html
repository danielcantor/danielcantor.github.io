<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A1024" media="(prefers-color-scheme: dark)" />
    <script>
      // Antes de pintar: marca que hay JS y aplica el tema elegido con el botón (ver src/lib/theme.js).
      ;(function () {
        var html = document.documentElement
        html.classList.add('js')
        try {
          var tema = localStorage.getItem('tema')
          if (tema !== 'light' && tema !== 'dark') return
          html.dataset.theme = tema
          var color = tema === 'dark' ? '#0A1024' : '#F4F3EF'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.content = color
          })
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
